<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Portal · AE Game Store</title>
    <meta
      name="description"
      content="Portal admin AE Game Store. Akses terenkripsi & dibatasi rate limit."
    />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <style>
      :root {
        --ocean: #0ea5e9;
        --ocean-deep: #0284c7;
        --ocean-soft: #38bdf8;
        --sakura: #fbcfe8;
        --sakura-deep: #f472b6;
        --danger: #f43f5e;
        --bg: #f0f9ff;
        --surface: rgba(255, 255, 255, 0.78);
        --surface-strong: rgba(255, 255, 255, 0.92);
        --text: #0c4a6e;
        --text-muted: #475569;
        --border: rgba(56, 189, 248, 0.4);
        --shadow: 0 24px 50px rgba(14, 165, 233, 0.15);
        --shadow-lg: 0 30px 60px -20px rgba(14, 165, 233, 0.4);
        --radius-xl: 28px;
        --radius-md: 14px;
        --radius-sm: 10px;
        --input-bg: rgba(255, 255, 255, 0.8);
        --warn-bg: #fef3c7;
        --warn-text: #92400e;
      }

      body.dark-theme {
        --bg: #0f172a;
        --surface: rgba(30, 41, 59, 0.82);
        --surface-strong: rgba(30, 41, 59, 0.95);
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --border: rgba(56, 189, 248, 0.18);
        --input-bg: rgba(15, 23, 42, 0.6);
        --warn-bg: #422006;
        --warn-text: #fde68a;
      }

      @media (prefers-color-scheme: dark) {
        body.auto-dark {
          --bg: #0f172a;
          --surface: rgba(30, 41, 59, 0.82);
          --surface-strong: rgba(30, 41, 59, 0.95);
          --text: #f8fafc;
          --text-muted: #94a3b8;
          --border: rgba(56, 189, 248, 0.18);
          --input-bg: rgba(15, 23, 42, 0.6);
          --warn-bg: #422006;
          --warn-text: #fde68a;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        overflow-x: hidden;
        position: relative;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      .bg-blob {
        position: fixed;
        filter: blur(80px);
        z-index: -1;
        opacity: 0.55;
        border-radius: 50%;
        pointer-events: none;
      }
      .blob-1 {
        top: -12vh;
        left: -10vw;
        width: 48vw;
        height: 48vw;
        background: radial-gradient(circle, var(--ocean), transparent 70%);
      }
      .blob-2 {
        bottom: -14vh;
        right: -10vw;
        width: 42vw;
        height: 42vw;
        background: radial-gradient(circle, var(--sakura), transparent 70%);
      }

      .top-bar {
        width: 100%;
        max-width: 460px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
        gap: 12px;
        position: relative;
        z-index: 2;
      }
      .top-bar .brand-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: var(--text);
        font-weight: 700;
        font-size: 14px;
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--surface);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      .top-bar .brand-link:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px -10px rgba(14, 165, 233, 0.4);
      }
      .top-bar .controls {
        display: inline-flex;
        gap: 6px;
      }
      .icon-btn,
      .lang-btn {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 10px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: all 0.2s ease;
        font-family: inherit;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 38px;
        height: 38px;
        line-height: 1;
      }
      .icon-btn:hover,
      .lang-btn:hover {
        transform: translateY(-2px);
        color: var(--ocean);
      }
      .lang-group {
        display: inline-flex;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .lang-group .lang-btn {
        border: none;
        border-radius: 0;
        padding: 8px 12px;
        background: transparent;
        backdrop-filter: none;
        min-width: 40px;
      }
      .lang-group .lang-btn.active {
        background: var(--ocean);
        color: #fff;
      }

      .login-wrapper {
        width: 100%;
        max-width: 460px;
        animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        position: relative;
        z-index: 1;
      }

      .card {
        background: var(--surface);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        padding: 44px 32px 36px;
        box-shadow: var(--shadow);
        text-align: center;
        position: relative;
        overflow: hidden;
      }
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(
          90deg,
          var(--ocean),
          var(--ocean-soft),
          var(--sakura),
          var(--ocean)
        );
        background-size: 200% 100%;
        animation: gradientShift 6s linear infinite;
      }
      @keyframes gradientShift {
        from {
          background-position: 0% 50%;
        }
        to {
          background-position: 200% 50%;
        }
      }

      .logo-badge {
        width: 68px;
        height: 68px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--ocean), var(--ocean-deep));
        color: white;
        font-size: 34px;
        box-shadow:
          0 12px 28px -6px rgba(14, 165, 233, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
        margin: 0 auto 18px;
        transform: rotate(-4deg);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
      }
      .logo-badge::after {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 22px;
        background: linear-gradient(135deg, var(--ocean), var(--sakura));
        z-index: -1;
        opacity: 0;
        filter: blur(14px);
        transition: opacity 0.3s ease;
      }
      .card:hover .logo-badge {
        transform: rotate(2deg) scale(1.06);
      }
      .card:hover .logo-badge::after {
        opacity: 0.6;
      }

      .lock-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(14, 165, 233, 0.12);
        color: var(--ocean-deep);
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      body.dark-theme .lock-pill {
        color: var(--ocean-soft);
      }

      .card h2 {
        font-size: 26px;
        font-weight: 800;
        margin-bottom: 6px;
        letter-spacing: -0.5px;
        color: var(--text);
      }
      .card p.subtitle {
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 26px;
        line-height: 1.55;
      }

      form {
        text-align: left;
      }
      .input-label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-muted);
        margin-bottom: 6px;
      }
      .input-group {
        position: relative;
        margin-bottom: 16px;
      }
      .input-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--ocean);
        font-size: 20px;
        pointer-events: none;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 14px 16px 14px 44px;
        border-radius: var(--radius-md);
        border: 1.5px solid var(--border);
        background: var(--input-bg);
        color: var(--text);
        font-size: 14.5px;
        font-weight: 500;
        font-family: inherit;
        transition: all 0.25s ease;
        outline: none;
      }
      input[type="password"] {
        padding-right: 48px;
        letter-spacing: 0.1em;
      }
      input:focus {
        border-color: var(--ocean);
        background: var(--surface-strong);
        box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.12);
      }
      input.is-error {
        border-color: var(--danger);
        background: rgba(244, 63, 94, 0.05);
      }
      input::placeholder {
        color: #94a3b8;
      }

      .toggle-eye {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 8px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        transition:
          color 0.2s,
          background 0.2s;
      }
      .toggle-eye:hover {
        color: var(--ocean);
        background: rgba(14, 165, 233, 0.08);
      }
      .toggle-eye iconify-icon {
        font-size: 20px;
      }

      .caps-warning {
        display: none;
        align-items: center;
        gap: 6px;
        background: var(--warn-bg);
        color: var(--warn-text);
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 700;
        margin-top: 6px;
      }
      .caps-warning.show {
        display: inline-flex;
        animation: fadeIn 0.2s ease;
      }

      .row-between {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        margin-bottom: 20px;
      }
      .remember {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        color: var(--text-muted);
        cursor: pointer;
        user-select: none;
      }
      .remember input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: var(--ocean);
        cursor: pointer;
        margin: 0;
        padding: 0;
      }
      .link {
        background: none;
        border: none;
        color: var(--ocean);
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        padding: 0;
      }
      .link:hover {
        color: var(--ocean-deep);
        text-decoration: underline;
      }

      .submit-btn {
        width: 100%;
        padding: 14px 16px;
        border: none;
        border-radius: var(--radius-md);
        background: linear-gradient(135deg, var(--ocean), var(--ocean-deep));
        color: white;
        font-size: 15.5px;
        font-weight: 800;
        font-family: inherit;
        cursor: pointer;
        margin-top: 4px;
        box-shadow: 0 10px 24px -6px rgba(14, 165, 233, 0.45);
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 50px;
      }
      .submit-btn::after {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 50%;
        height: 100%;
        background: linear-gradient(
          to right,
          transparent,
          rgba(255, 255, 255, 0.35),
          transparent
        );
        transform: skewX(-20deg);
        transition: 0.5s;
      }
      .submit-btn:not(:disabled):hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 30px -6px rgba(14, 165, 233, 0.6);
      }
      .submit-btn:not(:disabled):hover::after {
        left: 150%;
      }
      .submit-btn:not(:disabled):active {
        transform: translateY(0);
      }
      .submit-btn:disabled {
        cursor: progress;
        opacity: 0.85;
      }
      .submit-btn iconify-icon {
        font-size: 20px;
      }
      .spinner {
        width: 18px;
        height: 18px;
        border: 2.5px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        display: none;
      }
      .submit-btn.loading .spinner {
        display: inline-block;
      }
      .submit-btn.loading .btn-label,
      .submit-btn.loading iconify-icon {
        display: none;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .footer {
        margin-top: 24px;
        font-size: 11.5px;
        color: var(--text-muted);
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .footer-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.18);
        animation: pulseDot 1.6s ease-in-out infinite;
      }
      .footer-sub {
        text-transform: none;
        font-weight: 500;
        font-size: 11px;
        letter-spacing: 0.2px;
      }
      @keyframes pulseDot {
        0%,
        100% {
          box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.15);
        }
        50% {
          box-shadow: 0 0 0 7px rgba(34, 197, 94, 0.05);
        }
      }

      .card.shake {
        animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      }
      @keyframes shake {
        10%,
        90% {
          transform: translateX(-1px);
        }
        20%,
        80% {
          transform: translateX(2px);
        }
        30%,
        50%,
        70% {
          transform: translateX(-4px);
        }
        40%,
        60% {
          transform: translateX(4px);
        }
      }

      .sakura {
        position: fixed;
        top: -10%;
        z-index: 0;
        pointer-events: none;
        background: var(--sakura);
        border-radius: 100% 0 100% 0;
        opacity: 0.85;
        animation:
          fall linear infinite,
          sway ease-in-out infinite alternate;
      }
      @keyframes fall {
        to {
          top: 110%;
        }
      }
      @keyframes sway {
        from {
          transform: translateX(-20px) rotate(0deg);
        }
        to {
          transform: translateX(20px) rotate(45deg);
        }
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 14px;
        }
        .top-bar {
          margin-bottom: 12px;
        }
        .top-bar .brand-link {
          padding: 7px 12px;
          font-size: 13px;
        }
        .card {
          padding: 32px 22px 26px;
          border-radius: 22px;
        }
        .card h2 {
          font-size: 22px;
        }
        .logo-badge {
          width: 60px;
          height: 60px;
          font-size: 30px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .logo-badge,
        .submit-btn,
        .card::before,
        .footer-dot,
        .sakura {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>

  <body class="auto-dark">
    <div class="bg-blob blob-1" aria-hidden="true"></div>
    <div class="bg-blob blob-2" aria-hidden="true"></div>

    <div class="top-bar">
      <a href="/" class="brand-link" data-i18n="backHome">
        <iconify-icon icon="solar:arrow-left-linear"></iconify-icon>
        <span>Kembali ke beranda</span>
      </a>
      <div class="controls">
        <div class="lang-group" role="group" aria-label="Language">
          <button
            type="button"
            class="lang-btn active"
            data-lang="id"
            aria-pressed="true"
          >
            ID
          </button>
          <button
            type="button"
            class="lang-btn"
            data-lang="en"
            aria-pressed="false"
          >
            EN
          </button>
        </div>
        <button
          type="button"
          class="icon-btn"
          id="themeToggle"
          aria-label="Toggle dark mode"
        >
          🌙
        </button>
      </div>
    </div>

    <div class="login-wrapper">
      <form class="card" id="loginCard" autocomplete="on" novalidate>
        <span class="lock-pill" data-i18n="lockPill">
          <iconify-icon icon="solar:shield-keyhole-linear"></iconify-icon>
          Restricted Access
        </span>
        <div class="logo-badge">⛩️</div>
        <h2 data-i18n="title">Admin Portal</h2>
        <p class="subtitle" data-i18n="subtitle">
          Silakan masuk untuk mengelola AE Game Store.
        </p>

        <div class="input-group">
          <label class="input-label" for="username" data-i18n="usernameLabel">
            Username
          </label>
          <div style="position: relative">
            <iconify-icon
              class="input-icon"
              icon="solar:user-rounded-linear"
            ></iconify-icon>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Username admin"
              autocomplete="username"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              data-i18n-placeholder="usernamePlaceholder"
              required
            />
          </div>
        </div>

        <div class="input-group">
          <label class="input-label" for="password" data-i18n="passwordLabel">
            Password
          </label>
          <div style="position: relative">
            <iconify-icon
              class="input-icon"
              icon="solar:lock-password-linear"
            ></iconify-icon>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Password admin"
              autocomplete="current-password"
              data-i18n-placeholder="passwordPlaceholder"
              required
            />
            <button
              type="button"
              class="toggle-eye"
              id="togglePass"
              aria-label="Tampilkan password"
            >
              <iconify-icon id="eyeIcon" icon="solar:eye-linear"></iconify-icon>
            </button>
          </div>
          <span class="caps-warning" id="capsWarning">
            <iconify-icon icon="solar:keyboard-linear"></iconify-icon>
            <span data-i18n="capsWarning">Caps Lock aktif</span>
          </span>
        </div>

        <div class="row-between">
          <label class="remember">
            <input type="checkbox" id="rememberMe" />
            <span data-i18n="remember">Ingat username</span>
          </label>
          <button
            type="button"
            class="link"
            id="forgotPass"
            data-i18n="forgotPass"
          >
            Lupa password?
          </button>
        </div>

        <button type="submit" class="submit-btn" id="loginBtn">
          <iconify-icon icon="solar:login-3-linear"></iconify-icon>
          <span class="btn-label" data-i18n="submitBtn">Masuk Dashboard</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>

        <div class="footer">
          <span>
            <span class="footer-dot"></span>
            <span data-i18n="secureBadge">Secure Admin Access</span>
          </span>
          <span class="footer-sub" data-i18n="rateLimitNote">
            Sesi terenkripsi · dibatasi rate limit
          </span>
        </div>
      </form>
    </div>

    <script>
      // ---------------- i18n ----------------
      const TRANS = {
        id: {
          backHome: "Kembali ke beranda",
          title: "Admin Portal",
          subtitle: "Silakan masuk untuk mengelola AE Game Store.",
          lockPill: "Akses Terbatas",
          usernameLabel: "Username",
          usernamePlaceholder: "Username admin",
          passwordLabel: "Password",
          passwordPlaceholder: "Password admin",
          capsWarning: "Caps Lock aktif",
          remember: "Ingat username",
          forgotPass: "Lupa password?",
          submitBtn: "Masuk Dashboard",
          secureBadge: "Secure Admin Access",
          rateLimitNote: "Sesi terenkripsi · dibatasi rate limit",
          fillBoth: "Isi username dan password dulu ya.",
          fillBothTitle: "Oops!",
          verifying: "Memverifikasi",
          success: "Berhasil Masuk!",
          accessDenied: "Akses Ditolak",
          tooMany: "Terlalu Banyak Percobaan",
          tooManyMsg: "Tunggu sekitar 1 menit lalu coba lagi.",
          wrongCred: "Username atau password salah.",
          connIssue: "Koneksi Bermasalah",
          timeout: "Request terlalu lama. Coba refresh lalu login lagi.",
          noServer: "Server tidak merespon, coba lagi nanti.",
          forgotTitle: "Lupa Password Admin",
          forgotMsg:
            "Akun admin tidak punya reset otomatis demi keamanan. Silakan hubungi pemilik website via Telegram untuk reset password.",
          showPass: "Tampilkan password",
          hidePass: "Sembunyikan password",
        },
        en: {
          backHome: "Back to homepage",
          title: "Admin Portal",
          subtitle: "Please sign in to manage AE Game Store.",
          lockPill: "Restricted Access",
          usernameLabel: "Username",
          usernamePlaceholder: "Admin username",
          passwordLabel: "Password",
          passwordPlaceholder: "Admin password",
          capsWarning: "Caps Lock is on",
          remember: "Remember username",
          forgotPass: "Forgot password?",
          submitBtn: "Sign in to Dashboard",
          secureBadge: "Secure Admin Access",
          rateLimitNote: "Encrypted session · rate-limited",
          fillBoth: "Please fill in both username and password.",
          fillBothTitle: "Oops!",
          verifying: "Verifying",
          success: "Signed in successfully!",
          accessDenied: "Access Denied",
          tooMany: "Too Many Attempts",
          tooManyMsg: "Please wait about 1 minute and try again.",
          wrongCred: "Incorrect username or password.",
          connIssue: "Connection Issue",
          timeout: "The request took too long. Refresh and try again.",
          noServer: "Server is not responding, please try again later.",
          forgotTitle: "Forgot Admin Password",
          forgotMsg:
            "Admin accounts have no automatic reset for security. Please contact the site owner via Telegram to reset the password.",
          showPass: "Show password",
          hidePass: "Hide password",
        },
      };

      let currentLang = localStorage.getItem("ae_lang") === "en" ? "en" : "id";

      function safeT(key) {
        return (TRANS[currentLang] || TRANS.id)[key] || key;
      }

      function applyLang() {
        document.documentElement.lang = currentLang;
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const k = el.getAttribute("data-i18n");
          if (TRANS[currentLang] && TRANS[currentLang][k] != null) {
            el.textContent = TRANS[currentLang][k];
          }
        });
        document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
          const k = el.getAttribute("data-i18n-placeholder");
          if (TRANS[currentLang] && TRANS[currentLang][k] != null) {
            el.setAttribute("placeholder", TRANS[currentLang][k]);
          }
        });
        document.querySelectorAll(".lang-btn").forEach((btn) => {
          const active = btn.getAttribute("data-lang") === currentLang;
          btn.classList.toggle("active", active);
          btn.setAttribute("aria-pressed", active ? "true" : "false");
        });
        const eyeBtn = document.getElementById("togglePass");
        if (eyeBtn) {
          const isHidden =
            document.getElementById("password").type === "password";
          eyeBtn.setAttribute(
            "aria-label",
            isHidden ? safeT("showPass") : safeT("hidePass"),
          );
        }
      }

      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          currentLang = btn.getAttribute("data-lang") || "id";
          try {
            localStorage.setItem("ae_lang", currentLang);
          } catch (e) {}
          applyLang();
        });
      });

      // ---------------- Theme ----------------
      function applyTheme(theme) {
        const body = document.body;
        body.classList.remove("dark-theme", "auto-dark");
        if (theme === "dark") {
          body.classList.add("dark-theme");
        } else if (theme === "light") {
          // no class
        } else {
          body.classList.add("auto-dark");
        }
        const btn = document.getElementById("themeToggle");
        if (btn) {
          btn.textContent = body.classList.contains("dark-theme") ? "☀️" : "🌙";
        }
      }

      const savedTheme = localStorage.getItem("ae_theme");
      applyTheme(savedTheme || "auto");

      document.getElementById("themeToggle").addEventListener("click", () => {
        const isDark = document.body.classList.contains("dark-theme");
        const next = isDark ? "light" : "dark";
        try {
          localStorage.setItem("ae_theme", next);
        } catch (e) {}
        applyTheme(next);
      });

      // ---------------- Show/Hide password ----------------
      const passInput = document.getElementById("password");
      const toggleBtn = document.getElementById("togglePass");
      const eyeIcon = document.getElementById("eyeIcon");
      toggleBtn.addEventListener("click", () => {
        if (passInput.type === "password") {
          passInput.type = "text";
          eyeIcon.setAttribute("icon", "solar:eye-closed-linear");
          toggleBtn.setAttribute("aria-label", safeT("hidePass"));
        } else {
          passInput.type = "password";
          eyeIcon.setAttribute("icon", "solar:eye-linear");
          toggleBtn.setAttribute("aria-label", safeT("showPass"));
        }
      });

      // ---------------- Caps Lock detection ----------------
      const capsWarn = document.getElementById("capsWarning");
      function updateCaps(e) {
        const isOn =
          typeof e.getModifierState === "function" &&
          e.getModifierState("CapsLock");
        capsWarn.classList.toggle("show", !!isOn);
      }
      [passInput, document.getElementById("username")].forEach((el) => {
        el.addEventListener("keyup", updateCaps);
        el.addEventListener("keydown", updateCaps);
      });

      // ---------------- Remember username ----------------
      const rememberCb = document.getElementById("rememberMe");
      const usernameInput = document.getElementById("username");
      try {
        const savedUser = localStorage.getItem("ae_admin_last_user");
        if (savedUser) {
          usernameInput.value = savedUser;
          rememberCb.checked = true;
        }
      } catch (e) {}

      // ---------------- Forgot password ----------------
      document.getElementById("forgotPass").addEventListener("click", () => {
        Swal.fire({
          icon: "info",
          title: safeT("forgotTitle"),
          text: safeT("forgotMsg"),
          confirmButtonColor: "#0ea5e9",
        });
      });

      // ---------------- Auto-focus ----------------
      window.addEventListener("DOMContentLoaded", () => {
        applyLang();
        setTimeout(() => {
          if (usernameInput.value.trim()) {
            passInput.focus();
          } else {
            usernameInput.focus();
          }
        }, 200);
      });

      // ---------------- Submit / Login ----------------
      const card = document.getElementById("loginCard");
      const loginBtn = document.getElementById("loginBtn");
      card.addEventListener("submit", async (event) => {
        event.preventDefault();
        await doLogin();
      });

      function setError(el, on) {
        if (!el) return;
        el.classList.toggle("is-error", !!on);
      }

      async function doLogin() {
        const username = usernameInput.value.trim();
        const password = passInput.value.trim();

        setError(usernameInput, false);
        setError(passInput, false);

        if (!username || !password) {
          setError(usernameInput, !username);
          setError(passInput, !password);
          card.classList.remove("shake");
          // restart shake animation
          void card.offsetWidth;
          card.classList.add("shake");
          Swal.fire({
            icon: "warning",
            title: safeT("fillBothTitle"),
            text: safeT("fillBoth"),
            confirmButtonColor: "#0ea5e9",
          });
          return;
        }

        // remember username
        try {
          if (rememberCb.checked) {
            localStorage.setItem("ae_admin_last_user", username);
          } else {
            localStorage.removeItem("ae_admin_last_user");
          }
        } catch (e) {}

        loginBtn.classList.add("loading");
        loginBtn.disabled = true;

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);

        try {
          const res = await fetch("/admin-login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
            signal: controller.signal,
          });

          clearTimeout(timeoutId);

          let data = {};
          try {
            data = await res.json();
          } catch (_) {}

          if (!res.ok) {
            card.classList.remove("shake");
            void card.offsetWidth;
            card.classList.add("shake");
            setError(usernameInput, true);
            setError(passInput, true);
            Swal.fire({
              icon: "error",
              title:
                res.status === 429 ? safeT("tooMany") : safeT("accessDenied"),
              text:
                data.message ||
                (res.status === 429 ? safeT("tooManyMsg") : safeT("wrongCred")),
              confirmButtonColor: "#fb7185",
            });
            return;
          }

          loginBtn.classList.remove("loading");
          loginBtn.querySelector(".btn-label").textContent = safeT("success");
          loginBtn.style.background =
            "linear-gradient(135deg, #22c55e, #16a34a)";
          setTimeout(() => {
            window.location.href = "/ae-control";
          }, 350);
        } catch (err) {
          card.classList.remove("shake");
          void card.offsetWidth;
          card.classList.add("shake");
          Swal.fire({
            icon: "error",
            title: safeT("connIssue"),
            text:
              err.name === "AbortError" ? safeT("timeout") : safeT("noServer"),
            confirmButtonColor: "#fb7185",
          });
        } finally {
          clearTimeout(timeoutId);
          if (!window.location.href.includes("/ae-control")) {
            loginBtn.classList.remove("loading");
            loginBtn.disabled = false;
          }
        }
      }

      // ---------------- Sakura particle (throttled, mobile-safe) ----------------
      const isMobile = window.matchMedia("(max-width: 640px)").matches;
      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;
      const sakuraEnabled = !isMobile && !reducedMotion;

      function createSakura() {
        const sakura = document.createElement("div");
        sakura.classList.add("sakura");
        const size = Math.random() * 10 + 5;
        sakura.style.width = size + "px";
        sakura.style.height = size + "px";
        sakura.style.left = Math.random() * 100 + "vw";
        sakura.style.animationDuration =
          Math.random() * 3 + 4 + "s, " + (Math.random() * 2 + 2) + "s";
        document.body.appendChild(sakura);
        setTimeout(() => sakura.remove(), 7000);
      }
      if (sakuraEnabled) {
        setInterval(createSakura, 1500);
      }
    </script>
  </body>
</html>
