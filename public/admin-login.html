<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Portal · AE Game Store</title>
    <meta name="description" content="Portal admin AE Game Store. Akses terenkripsi dan dibatasi rate limit." />
    <meta name="theme-color" content="#eeeeea" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #eeeeea;
        --bg-2: #f8f8f4;
        --surface: #ffffff;
        --surface-2: #f4f4ef;
        --surface-3: #ecece6;
        --ink: #111111;
        --ink-2: #242424;
        --muted: #6d6d68;
        --line: #d8d8d0;
        --line-strong: #111111;
        --danger: #b42318;
        --warn-bg: #f6f0dc;
        --warn-text: #6f4e00;
        --success: #147a4a;
        --radius-xl: 34px;
        --radius-lg: 26px;
        --radius-md: 18px;
        --radius-sm: 14px;
        --pill: 999px;
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.08);
        --shadow-sm: 0 12px 32px rgba(0, 0, 0, 0.06);
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      body.dark-theme,
      body.auto-dark.dark-theme {
        color-scheme: dark;
        --bg: #0e0e0e;
        --bg-2: #161616;
        --surface: #1b1b1b;
        --surface-2: #242424;
        --surface-3: #303030;
        --ink: #f5f5f0;
        --ink-2: #ffffff;
        --muted: #aaa9a3;
        --line: #3a3a3a;
        --line-strong: #f5f5f0;
        --danger: #ffb4ab;
        --warn-bg: #302817;
        --warn-text: #f4d48a;
        --success: #8dd8ad;
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
        --shadow-sm: 0 12px 32px rgba(0, 0, 0, 0.28);
      }

      @media (prefers-color-scheme: dark) {
        body.auto-dark {
          color-scheme: dark;
          --bg: #0e0e0e;
          --bg-2: #161616;
          --surface: #1b1b1b;
          --surface-2: #242424;
          --surface-3: #303030;
          --ink: #f5f5f0;
          --ink-2: #ffffff;
          --muted: #aaa9a3;
          --line: #3a3a3a;
          --line-strong: #f5f5f0;
          --danger: #ffb4ab;
          --warn-bg: #302817;
          --warn-text: #f4d48a;
          --success: #8dd8ad;
          --shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
          --shadow-sm: 0 12px 32px rgba(0, 0, 0, 0.28);
        }
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
      html, body { font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: max(18px, env(safe-area-inset-top)) 18px max(22px, env(safe-area-inset-bottom));
        overflow-x: hidden;
        background:
          radial-gradient(circle at 1px 1px, rgba(17,17,17,.075) 1px, transparent 0) 0 0 / 22px 22px,
          linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
        color: var(--ink);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      body.dark-theme,
      body.auto-dark.dark-theme { background: radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1px, transparent 0) 0 0 / 22px 22px, linear-gradient(180deg, #161616 0%, #0e0e0e 100%); }
      @media (prefers-color-scheme: dark) { body.auto-dark { background: radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1px, transparent 0) 0 0 / 22px 22px, linear-gradient(180deg, #161616 0%, #0e0e0e 100%); } }
      a { color: inherit; text-decoration: none; }
      button, input { font: inherit; }
      button { border: 0; background: transparent; color: inherit; cursor: pointer; }
      :focus-visible { outline: 3px solid var(--line-strong); outline-offset: 3px; border-radius: var(--radius-sm); }
      ::selection { background: var(--ink); color: var(--surface); }

      .top-bar {
        width: min(460px, 100%);
        min-height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 0 auto 18px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: color-mix(in srgb, var(--surface) 84%, transparent);
        box-shadow: var(--shadow-sm);
      }
      .brand-link {
        min-width: 0;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        height: 40px;
        padding: 0 13px;
        border-radius: var(--pill);
        color: var(--ink-2);
        font-size: 13px;
        font-weight: 850;
      }
      .brand-link iconify-icon { font-size: 18px; }
      .controls { display: inline-flex; align-items: center; gap: 7px; }
      .lang-group {
        display: inline-flex;
        padding: 4px;
        gap: 4px;
        border: 1px solid var(--line);
        border-radius: var(--pill);
        background: var(--surface-2);
      }
      .lang-btn, .icon-btn {
        height: 34px;
        min-width: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--pill);
        color: var(--ink);
        font-size: 12px;
        font-weight: 900;
        transition: background .18s var(--ease), color .18s var(--ease), transform .18s var(--ease);
      }
      .lang-btn { padding: 0 11px; }
      .icon-btn { border: 1px solid var(--line); background: var(--surface); font-size: 14px; }
      .lang-btn.active { background: var(--ink); color: var(--surface); }
      .lang-btn:hover, .icon-btn:hover, .brand-link:hover { transform: translateY(-1px); background: var(--surface-3); }
      .lang-btn.active:hover { background: var(--ink); color: var(--surface); }

      .login-wrapper {
        width: min(460px, 100%);
        animation: fadeUp .45s var(--ease) both;
      }
      .card {
        position: relative;
        overflow: hidden;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: var(--radius-xl);
        background: color-mix(in srgb, var(--surface) 88%, transparent);
        box-shadow: var(--shadow);
        text-align: left;
      }
      .card::before { content: none; }
      .card-inner {
        display: grid;
        gap: 18px;
      }
      .auth-head {
        padding: 8px 6px 2px;
        text-align: center;
      }
      .logo-badge {
        width: 62px;
        height: 62px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 14px;
        border-radius: 23px;
        background: var(--ink);
        color: var(--surface);
        font-size: 18px;
        font-weight: 950;
        letter-spacing: .08em;
      }
      .lock-pill {
        width: fit-content;
        margin: 0 auto 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 32px;
        padding: 7px 11px;
        border: 1px solid var(--line);
        border-radius: var(--pill);
        background: var(--surface-2);
        color: var(--muted);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      .lock-pill iconify-icon { font-size: 16px; }
      .card h2 {
        margin: 0;
        color: var(--ink-2);
        font-size: clamp(28px, 8vw, 42px);
        line-height: .98;
        letter-spacing: -0.07em;
        font-weight: 950;
      }
      .subtitle {
        max-width: 31ch;
        margin: 10px auto 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.65;
        text-align: center;
      }
      form { text-align: left; }
      .form-grid {
        display: grid;
        gap: 14px;
        margin-top: 2px;
      }
      .input-label {
        display: block;
        margin: 0 0 7px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 900;
        letter-spacing: .07em;
        text-transform: uppercase;
      }
      .input-group { position: relative; }
      .input-wrap { position: relative; }
      .input-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        font-size: 19px;
        pointer-events: none;
      }
      input[type="text"], input[type="password"] {
        width: 100%;
        min-height: 52px;
        padding: 14px 16px 14px 44px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--surface);
        color: var(--ink);
        font-size: 14px;
        font-weight: 700;
        outline: none;
        box-shadow: none;
        transition: border-color .18s var(--ease), background .18s var(--ease), box-shadow .18s var(--ease);
      }
      input[type="password"] { padding-right: 48px; letter-spacing: .05em; }
      input::placeholder { color: color-mix(in srgb, var(--muted) 78%, transparent); }
      input:focus { border-color: var(--line-strong); background: var(--surface); box-shadow: 0 0 0 4px color-mix(in srgb, var(--line-strong) 10%, transparent); }
      input.is-error { border-color: var(--danger); box-shadow: 0 0 0 4px color-mix(in srgb, var(--danger) 12%, transparent); }
      .toggle-eye {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        width: 38px;
        height: 38px;
        display: inline-grid;
        place-items: center;
        border-radius: 14px;
        color: var(--muted);
      }
      .toggle-eye:hover { background: var(--surface-2); color: var(--ink); }
      .toggle-eye iconify-icon { font-size: 20px; }
      .caps-warning {
        display: none;
        width: fit-content;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
        padding: 8px 10px;
        border: 1px solid color-mix(in srgb, var(--warn-text) 24%, transparent);
        border-radius: var(--radius-sm);
        background: var(--warn-bg);
        color: var(--warn-text);
        font-size: 12px;
        font-weight: 800;
      }
      .caps-warning.show { display: inline-flex; }
      .row-between {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 2px 0 0;
        flex-wrap: wrap;
      }
      .remember {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
        user-select: none;
        cursor: pointer;
      }
      .remember input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--surface);
      }
      .remember input[type="checkbox"]:checked { background: var(--ink); border-color: var(--ink); }
      .remember input[type="checkbox"]:checked::after { content: "✓"; display: grid; place-items: center; color: var(--surface); font-size: 12px; font-weight: 950; line-height: 1; }
      .link {
        color: var(--ink);
        font-size: 13px;
        font-weight: 900;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .submit-btn {
        width: 100%;
        min-height: 54px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        margin-top: 2px;
        padding: 14px 16px;
        border: 1px solid var(--line-strong);
        border-radius: 18px;
        background: var(--ink);
        color: var(--surface);
        font-size: 14px;
        font-weight: 950;
        letter-spacing: -.01em;
        box-shadow: none;
        transition: transform .18s var(--ease), opacity .18s var(--ease);
      }
      .submit-btn:hover:not(:disabled) { transform: translateY(-1px); opacity: .96; }
      .submit-btn::after { content: none; }
      .submit-btn:disabled { cursor: progress; opacity: .72; }
      .submit-btn iconify-icon { font-size: 20px; }
      .spinner {
        width: 18px;
        height: 18px;
        display: none;
        border: 2px solid color-mix(in srgb, var(--surface) 40%, transparent);
        border-top-color: var(--surface);
        border-radius: 50%;
        animation: spin .75s linear infinite;
      }
      .submit-btn.loading .spinner { display: inline-block; }
      .submit-btn.loading .btn-label, .submit-btn.loading iconify-icon { display: none; }
      .footer {
        margin-top: 16px;
        padding: 14px 14px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--surface-2);
        color: var(--muted);
        display: grid;
        justify-items: center;
        gap: 4px;
        text-align: center;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .03em;
        text-transform: uppercase;
      }
      .footer > span:first-child { display: inline-flex; align-items: center; gap: 7px; }
      .footer-dot {
        width: 8px;
        height: 8px;
        display: inline-block;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--success) 16%, transparent);
      }
      .footer-sub { font-size: 11px; font-weight: 650; letter-spacing: 0; text-transform: none; }
      .swal2-popup {
        border: 1px solid var(--line) !important;
        border-radius: 24px !important;
        background: var(--surface) !important;
        color: var(--ink) !important;
        box-shadow: var(--shadow) !important;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif !important;
      }
      .swal2-title, .swal2-html-container { color: var(--ink) !important; }
      .swal2-confirm, .swal2-cancel, .swal2-deny {
        border-radius: 999px !important;
        background: var(--ink) !important;
        color: var(--surface) !important;
        box-shadow: none !important;
        font-weight: 850 !important;
      }
      .card.shake { animation: shake .42s var(--ease) both; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes shake {
        10%, 90% { transform: translateX(-1px); }
        20%, 80% { transform: translateX(2px); }
        30%, 50%, 70% { transform: translateX(-4px); }
        40%, 60% { transform: translateX(4px); }
      }
      @media (max-width: 480px) {
        body { padding: 10px; justify-content: flex-start; }
        .top-bar { margin-bottom: 12px; border-radius: 24px; }
        .brand-link span { display: none; }
        .brand-link { width: 40px; justify-content: center; padding: 0; }
        .card { padding: 14px; border-radius: 28px; }
        .auth-head { padding-top: 4px; }
        .logo-badge { width: 54px; height: 54px; border-radius: 20px; margin-bottom: 12px; }
        .card h2 { font-size: 30px; }
        .subtitle { font-size: 12.5px; }
        .row-between { align-items: flex-start; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
      }

    </style>
  </head>

  <body class="auto-dark">
    <div class="top-bar">
      <a href="/" class="brand-link" data-i18n="backHome" aria-label="Kembali ke beranda">
        <iconify-icon icon="solar:arrow-left-linear" aria-hidden="true"></iconify-icon>
        <span>Kembali ke beranda</span>
      </a>
      <div class="controls">
        <div class="lang-group" role="group" aria-label="Language">
          <button type="button" class="lang-btn active" data-lang="id" aria-pressed="true">ID</button>
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <button type="button" class="icon-btn" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
      </div>
    </div>

    <div class="login-wrapper">
      <form class="card" id="loginCard" autocomplete="on" novalidate>
        <div class="card-inner">
          <div class="auth-head">
            <span class="lock-pill" data-i18n="lockPill">
              <iconify-icon icon="solar:shield-keyhole-linear" aria-hidden="true"></iconify-icon>
              Restricted Access
            </span>
            <div class="logo-badge" aria-hidden="true">AE</div>
            <h2 data-i18n="title">Admin Portal</h2>
            <p class="subtitle" data-i18n="subtitle">Silakan masuk untuk mengelola AE Game Store.</p>
          </div>

          <div class="form-grid">
            <div class="input-group">
              <label class="input-label" for="username" data-i18n="usernameLabel">Username</label>
              <div class="input-wrap">
                <iconify-icon class="input-icon" icon="solar:user-rounded-linear" aria-hidden="true"></iconify-icon>
                <input type="text" id="username" name="username" placeholder="Username admin" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" data-i18n-placeholder="usernamePlaceholder" required />
              </div>
            </div>

            <div class="input-group">
              <label class="input-label" for="password" data-i18n="passwordLabel">Password</label>
              <div class="input-wrap">
                <iconify-icon class="input-icon" icon="solar:lock-password-linear" aria-hidden="true"></iconify-icon>
                <input type="password" id="password" name="password" placeholder="Password admin" autocomplete="current-password" data-i18n-placeholder="passwordPlaceholder" required />
                <button type="button" class="toggle-eye" id="togglePass" aria-label="Tampilkan password">
                  <iconify-icon id="eyeIcon" icon="solar:eye-linear" aria-hidden="true"></iconify-icon>
                </button>
              </div>
              <span class="caps-warning" id="capsWarning">
                <iconify-icon icon="solar:keyboard-linear" aria-hidden="true"></iconify-icon>
                <span data-i18n="capsWarning">Caps Lock aktif</span>
              </span>
            </div>

            <div class="row-between">
              <label class="remember">
                <input type="checkbox" id="rememberMe" />
                <span data-i18n="remember">Ingat username</span>
              </label>
              <button type="button" class="link" id="forgotPass" data-i18n="forgotPass">Lupa password?</button>
            </div>

            <button type="submit" class="submit-btn" id="loginBtn">
              <iconify-icon icon="solar:login-3-linear" aria-hidden="true"></iconify-icon>
              <span class="btn-label" data-i18n="submitBtn">Masuk Dashboard</span>
              <span class="spinner" aria-hidden="true"></span>
            </button>
          </div>

          <div class="footer">
            <span><span class="footer-dot"></span><span data-i18n="secureBadge">Secure Admin Access</span></span>
            <span class="footer-sub" data-i18n="rateLimitNote">Sesi terenkripsi · dibatasi rate limit</span>
          </div>
        </div>
      </form>
    </div>

    <script>
      // ---------------- i18n ----------------
      const TRANS = {
        id: {
          backHome: "Kembali ke beranda",
          title: "Admin Portal",
          subtitle: "Silakan masuk untuk mengelola AE Game Store.",
          lockPill: "Akses Terbatas",
          usernameLabel: "Username",
          usernamePlaceholder: "Username admin",
          passwordLabel: "Password",
          passwordPlaceholder: "Password admin",
          capsWarning: "Caps Lock aktif",
          remember: "Ingat username",
          forgotPass: "Lupa password?",
          submitBtn: "Masuk Dashboard",
          secureBadge: "Secure Admin Access",
          rateLimitNote: "Sesi terenkripsi · dibatasi rate limit",
          fillBoth: "Isi username dan password dulu ya.",
          fillBothTitle: "Oops!",
          verifying: "Memverifikasi",
          success: "Berhasil Masuk!",
          accessDenied: "Akses Ditolak",
          tooMany: "Terlalu Banyak Percobaan",
          tooManyMsg: "Tunggu sekitar 1 menit lalu coba lagi.",
          wrongCred: "Username atau password salah.",
          connIssue: "Koneksi Bermasalah",
          timeout: "Request terlalu lama. Coba refresh lalu login lagi.",
          noServer: "Server tidak merespon, coba lagi nanti.",
          forgotTitle: "Lupa Password Admin",
          forgotMsg:
            "Akun admin tidak punya reset otomatis demi keamanan. Silakan hubungi pemilik website via Telegram untuk reset password.",
          showPass: "Tampilkan password",
          hidePass: "Sembunyikan password",
        },
        en: {
          backHome: "Back to homepage",
          title: "Admin Portal",
          subtitle: "Please sign in to manage AE Game Store.",
          lockPill: "Restricted Access",
          usernameLabel: "Username",
          usernamePlaceholder: "Admin username",
          passwordLabel: "Password",
          passwordPlaceholder: "Admin password",
          capsWarning: "Caps Lock is on",
          remember: "Remember username",
          forgotPass: "Forgot password?",
          submitBtn: "Sign in to Dashboard",
          secureBadge: "Secure Admin Access",
          rateLimitNote: "Encrypted session · rate-limited",
          fillBoth: "Please fill in both username and password.",
          fillBothTitle: "Oops!",
          verifying: "Verifying",
          success: "Signed in successfully!",
          accessDenied: "Access Denied",
          tooMany: "Too Many Attempts",
          tooManyMsg: "Please wait about 1 minute and try again.",
          wrongCred: "Incorrect username or password.",
          connIssue: "Connection Issue",
          timeout: "The request took too long. Refresh and try again.",
          noServer: "Server is not responding, please try again later.",
          forgotTitle: "Forgot Admin Password",
          forgotMsg:
            "Admin accounts have no automatic reset for security. Please contact the site owner via Telegram to reset the password.",
          showPass: "Show password",
          hidePass: "Hide password",
        },
      };

      let currentLang = localStorage.getItem("ae_lang") === "en" ? "en" : "id";

      function safeT(key) {
        return (TRANS[currentLang] || TRANS.id)[key] || key;
      }

      function applyLang() {
        document.documentElement.lang = currentLang;
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const k = el.getAttribute("data-i18n");
          if (TRANS[currentLang] && TRANS[currentLang][k] != null) {
            el.textContent = TRANS[currentLang][k];
          }
        });
        document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
          const k = el.getAttribute("data-i18n-placeholder");
          if (TRANS[currentLang] && TRANS[currentLang][k] != null) {
            el.setAttribute("placeholder", TRANS[currentLang][k]);
          }
        });
        document.querySelectorAll(".lang-btn").forEach((btn) => {
          const active = btn.getAttribute("data-lang") === currentLang;
          btn.classList.toggle("active", active);
          btn.setAttribute("aria-pressed", active ? "true" : "false");
        });
        const eyeBtn = document.getElementById("togglePass");
        if (eyeBtn) {
          const isHidden =
            document.getElementById("password").type === "password";
          eyeBtn.setAttribute(
            "aria-label",
            isHidden ? safeT("showPass") : safeT("hidePass"),
          );
        }
      }

      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          currentLang = btn.getAttribute("data-lang") || "id";
          try {
            localStorage.setItem("ae_lang", currentLang);
          } catch (e) {}
          applyLang();
        });
      });

      // ---------------- Theme ----------------
      function applyTheme(theme) {
        const body = document.body;
        body.classList.remove("dark-theme", "auto-dark");
        if (theme === "dark") {
          body.classList.add("dark-theme");
        } else if (theme === "light") {
          // no class
        } else {
          body.classList.add("auto-dark");
        }
        const btn = document.getElementById("themeToggle");
        if (btn) {
          btn.textContent = body.classList.contains("dark-theme") ? "☀️" : "🌙";
        }
      }

      const savedTheme = localStorage.getItem("ae_theme");
      applyTheme(savedTheme || "auto");

      document.getElementById("themeToggle").addEventListener("click", () => {
        const isDark = document.body.classList.contains("dark-theme");
        const next = isDark ? "light" : "dark";
        try {
          localStorage.setItem("ae_theme", next);
        } catch (e) {}
        applyTheme(next);
      });

      // ---------------- Show/Hide password ----------------
      const passInput = document.getElementById("password");
      const toggleBtn = document.getElementById("togglePass");
      const eyeIcon = document.getElementById("eyeIcon");
      toggleBtn.addEventListener("click", () => {
        if (passInput.type === "password") {
          passInput.type = "text";
          eyeIcon.setAttribute("icon", "solar:eye-closed-linear");
          toggleBtn.setAttribute("aria-label", safeT("hidePass"));
        } else {
          passInput.type = "password";
          eyeIcon.setAttribute("icon", "solar:eye-linear");
          toggleBtn.setAttribute("aria-label", safeT("showPass"));
        }
      });

      // ---------------- Caps Lock detection ----------------
      const capsWarn = document.getElementById("capsWarning");
      function updateCaps(e) {
        const isOn =
          typeof e.getModifierState === "function" &&
          e.getModifierState("CapsLock");
        capsWarn.classList.toggle("show", !!isOn);
      }
      [passInput, document.getElementById("username")].forEach((el) => {
        el.addEventListener("keyup", updateCaps);
        el.addEventListener("keydown", updateCaps);
      });

      // ---------------- Remember username ----------------
      const rememberCb = document.getElementById("rememberMe");
      const usernameInput = document.getElementById("username");
      try {
        const savedUser = localStorage.getItem("ae_admin_last_user");
        if (savedUser) {
          usernameInput.value = savedUser;
          rememberCb.checked = true;
        }
      } catch (e) {}

      // ---------------- Forgot password ----------------
      document.getElementById("forgotPass").addEventListener("click", () => {
        Swal.fire({
          icon: "info",
          title: safeT("forgotTitle"),
          text: safeT("forgotMsg"),
          confirmButtonColor: "#111111",
        });
      });

      // ---------------- Auto-focus ----------------
      window.addEventListener("DOMContentLoaded", () => {
        applyLang();
        setTimeout(() => {
          if (usernameInput.value.trim()) {
            passInput.focus();
          } else {
            usernameInput.focus();
          }
        }, 200);
      });

      // ---------------- Submit / Login ----------------
      const card = document.getElementById("loginCard");
      const loginBtn = document.getElementById("loginBtn");
      card.addEventListener("submit", async (event) => {
        event.preventDefault();
        await doLogin();
      });

      function setError(el, on) {
        if (!el) return;
        el.classList.toggle("is-error", !!on);
      }

      async function doLogin() {
        const username = usernameInput.value.trim();
        const password = passInput.value.trim();

        setError(usernameInput, false);
        setError(passInput, false);

        if (!username || !password) {
          setError(usernameInput, !username);
          setError(passInput, !password);
          card.classList.remove("shake");
          // restart shake animation
          void card.offsetWidth;
          card.classList.add("shake");
          Swal.fire({
            icon: "warning",
            title: safeT("fillBothTitle"),
            text: safeT("fillBoth"),
            confirmButtonColor: "#111111",
          });
          return;
        }

        // remember username
        try {
          if (rememberCb.checked) {
            localStorage.setItem("ae_admin_last_user", username);
          } else {
            localStorage.removeItem("ae_admin_last_user");
          }
        } catch (e) {}

        loginBtn.classList.add("loading");
        loginBtn.disabled = true;

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);

        try {
          const res = await fetch("/admin-login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
            signal: controller.signal,
          });

          clearTimeout(timeoutId);

          let data = {};
          try {
            data = await res.json();
          } catch (_) {}

          if (!res.ok) {
            card.classList.remove("shake");
            void card.offsetWidth;
            card.classList.add("shake");
            setError(usernameInput, true);
            setError(passInput, true);
            Swal.fire({
              icon: "error",
              title:
                res.status === 429 ? safeT("tooMany") : safeT("accessDenied"),
              text:
                data.message ||
                (res.status === 429 ? safeT("tooManyMsg") : safeT("wrongCred")),
              confirmButtonColor: "#111111",
            });
            return;
          }

          loginBtn.classList.remove("loading");
          loginBtn.querySelector(".btn-label").textContent = safeT("success");
          loginBtn.style.background =
            "#111111";
          setTimeout(() => {
            window.location.href = "/ae-control";
          }, 350);
        } catch (err) {
          card.classList.remove("shake");
          void card.offsetWidth;
          card.classList.add("shake");
          Swal.fire({
            icon: "error",
            title: safeT("connIssue"),
            text:
              err.name === "AbortError" ? safeT("timeout") : safeT("noServer"),
            confirmButtonColor: "#111111",
          });
        } finally {
          clearTimeout(timeoutId);
          if (!window.location.href.includes("/ae-control")) {
            loginBtn.classList.remove("loading");
            loginBtn.disabled = false;
          }
        }
      }
    </script>
  </body>
</html>
