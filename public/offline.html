<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — AE Game Store</title>
    <meta name="theme-color" content="#ffe135" />
    <link rel="manifest" href="/manifest.json" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f0f9ff;
        --card: rgba(255, 255, 255, 0.92);
        --ocean: #0ea5e9;
        --sakura: #fbcfe8;
        --ink: #0f172a;
        --muted: #64748b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          sans-serif;
        background: linear-gradient(135deg, #f0f9ff 0%, #fef6f9 100%);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .offline-card {
        background: var(--card);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(14, 165, 233, 0.12);
        border-radius: 24px;
        padding: 36px 28px;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 24px 48px -24px rgba(14, 165, 233, 0.25);
      }
      .offline-icon {
        font-size: 64px;
        margin-bottom: 16px;
        animation: wave 2.4s ease-in-out infinite;
        display: inline-block;
      }
      @keyframes wave {
        0%,
        100% {
          transform: rotate(-6deg);
        }
        50% {
          transform: rotate(6deg);
        }
      }
      h1 {
        margin: 0 0 8px;
        font-size: 26px;
        font-weight: 800;
        color: var(--ocean);
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.5;
        font-size: 15px;
      }
      .offline-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      button,
      a.btn {
        appearance: none;
        border: none;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        padding: 12px 22px;
        border-radius: 999px;
        cursor: pointer;
        text-decoration: none;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      .btn-primary {
        background: var(--ocean);
        color: #fff;
        box-shadow: 0 12px 24px -12px rgba(14, 165, 233, 0.6);
      }
      .btn-primary:hover {
        transform: translateY(-2px);
      }
      .btn-secondary {
        background: rgba(14, 165, 233, 0.1);
        color: var(--ocean);
      }
      .favorites-section {
        margin-top: 28px;
        text-align: left;
      }
      .favorites-section h2 {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin: 0 0 10px;
      }
      .favorites-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .favorite-item {
        padding: 10px 14px;
        background: rgba(14, 165, 233, 0.06);
        border-radius: 12px;
        font-weight: 600;
        font-size: 14px;
        color: var(--ocean);
      }
      .favorites-empty {
        color: var(--muted);
        font-size: 13px;
        font-style: italic;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: linear-gradient(135deg, #0c1a2c 0%, #1a1428 100%);
          color: #e2e8f0;
        }
        .offline-card {
          background: rgba(15, 23, 42, 0.85);
          border-color: rgba(14, 165, 233, 0.2);
        }
        p {
          color: #94a3b8;
        }
        .favorite-item {
          background: rgba(14, 165, 233, 0.15);
          color: #7dd3fc;
        }
      }
    </style>
  
<style id="ae-neo-brutalism-v2-page">
/* AE Neo Brutalism V2 — standalone page overlay */
:root{
  --nb-ink:#101010;
  --nb-paper:#fffdf2;
  --nb-yellow:#ffe135;
  --nb-cyan:#28d7ff;
  --nb-pink:#ff4fa3;
  --nb-red:#ff4d4d;
  --nb-green:#27d17f;
  --nb-muted:#555;
  --nb-border:3px solid var(--nb-ink);
  --nb-border-thin:2px solid var(--nb-ink);
  --nb-radius:20px;
  --nb-shadow:6px 6px 0 var(--nb-ink);
  --nb-shadow-sm:4px 4px 0 var(--nb-ink);
  --primary:var(--nb-cyan);
  --primary-strong:#1dbde5;
  --primary-deep:var(--nb-ink);
  --secondary:var(--nb-pink);
  --secondary-strong:#e5398a;
  --bg:var(--nb-paper);
  --bg-color:var(--nb-paper);
  --card-bg:#fff;
  --card-bg-strong:#fff;
  --surface:#fff;
  --surface-strong:#fff;
  --text-main:var(--nb-ink);
  --text-strong:var(--nb-ink);
  --text:#101010;
  --text-muted:#555;
  --border:var(--nb-ink);
  --border-color:var(--nb-ink);
  --shadow:var(--nb-shadow);
  --shadow-md:var(--nb-shadow);
  --shadow-lg:8px 8px 0 var(--nb-ink);
  --radius-xl:24px;
  --radius-lg:20px;
  --radius-md:14px;
}
body.dark-theme{
  --nb-paper:#171717;
  --card-bg:#242424;
  --card-bg-strong:#2a2a2a;
  --surface:#242424;
  --surface-strong:#2a2a2a;
  --text-main:#fffdf2;
  --text-strong:#fff;
  --text:#fffdf2;
  --text-muted:#d5d5d5;
}
html,body{scroll-behavior:smooth}
body{
  background-color:var(--nb-paper)!important;
  background-image:radial-gradient(circle at 1px 1px,rgba(16,16,16,.13) 1px,transparent 0)!important;
  background-size:18px 18px!important;
  color:var(--text-main)!important;
  font-family:"Space Grotesk","Plus Jakarta Sans",system-ui,sans-serif!important;
}
.bg-blob,.watercolor-blob,.blob-1,.blob-2{display:none!important}
main,.auth-shell,.account-shell,.result-shell,.admin-shell,.offline-card,.payment-card,.card,.panel,.auth-card,.account-card,.result-card,.security-card,.order-card,.profile-card,.login-card,.admin-card,.status-card{
  background:var(--card-bg-strong)!important;
  color:var(--text-main)!important;
  border:var(--nb-border)!important;
  border-radius:var(--nb-radius)!important;
  box-shadow:var(--nb-shadow)!important;
  backdrop-filter:none!important;
}
h1,h2,h3,.brand-title,.page-title,.card-title{
  color:var(--text-strong)!important;
  background:none!important;
  -webkit-text-fill-color:currentColor!important;
  font-family:"Space Grotesk","Plus Jakarta Sans",system-ui,sans-serif!important;
  font-weight:900!important;
  letter-spacing:-.04em!important;
}
p,small,span,label{color:inherit}
input,select,textarea,.input,.form-input{
  background:#fff!important;
  color:#101010!important;
  border:var(--nb-border-thin)!important;
  border-radius:14px!important;
  box-shadow:3px 3px 0 var(--nb-ink)!important;
  outline:none!important;
}
input:focus,select:focus,textarea:focus{
  box-shadow:0 0 0 4px var(--nb-yellow),3px 3px 0 var(--nb-ink)!important;
}
button,a.btn,.btn,.primary-btn,.secondary-btn,.ghost-btn,.action-btn,.admin-btn,.payment-actions button,.payment-actions a,.back-link,.theme-toggle,.submit-btn{
  border:var(--nb-border-thin)!important;
  border-radius:999px!important;
  box-shadow:var(--nb-shadow-sm)!important;
  background:var(--nb-yellow)!important;
  color:#101010!important;
  font-weight:900!important;
  text-decoration:none!important;
  transition:transform .14s ease,box-shadow .14s ease!important;
}
button:hover,a.btn:hover,.btn:hover,.primary-btn:hover,.action-btn:hover{
  transform:translate(2px,2px)!important;
  box-shadow:2px 2px 0 var(--nb-ink)!important;
}
.primary-btn,.submit-btn,.payment-actions button,.admin-btn{background:var(--nb-cyan)!important}
.danger,.danger-btn,.logout-btn{background:var(--nb-red)!important;color:#fff!important}
.success,.success-badge{background:var(--nb-green)!important;color:#101010!important}
.badge,.status-badge,.pill,.tag,.kicker,.payment-kicker{
  display:inline-flex!important;
  width:fit-content!important;
  background:var(--nb-yellow)!important;
  color:#101010!important;
  border:var(--nb-border-thin)!important;
  border-radius:999px!important;
  box-shadow:3px 3px 0 var(--nb-ink)!important;
  font-weight:900!important;
}
.payment-card{max-width:480px!important}
.payment-amount,.payment-qr,.payment-status,.detail-box,.info-box,.alert,.history-item,.order-item{
  background:#fff!important;
  border:var(--nb-border-thin)!important;
  border-radius:16px!important;
  box-shadow:3px 3px 0 var(--nb-ink)!important;
}
.payment-qr img{border-radius:12px!important}
@media(max-width:768px){
  :root{--nb-border:2px solid var(--nb-ink);--nb-shadow:4px 4px 0 var(--nb-ink)}
  body{background-size:16px 16px!important}
  main,.auth-shell,.account-shell,.result-shell,.admin-shell,.offline-card,.payment-card,.card,.panel,.auth-card,.account-card,.result-card{
    border-radius:18px!important;
    box-shadow:4px 4px 0 var(--nb-ink)!important;
  }
  h1{font-size:clamp(28px,10vw,42px)!important}
  .bg-blob,.decor,.floating,.animation{display:none!important}
  button,a.btn,.btn{min-height:42px!important}
}
</style>

  </head>
  <body>
    <div class="offline-card">
      <div class="offline-icon" aria-hidden="true">🌊</div>
      <h1>Sinyal lagi turun</h1>
      <p>
        Koneksi internetmu terputus. Cek WiFi atau data seluler, lalu coba lagi.
        Halaman ini tersedia offline berkat AE Game Store PWA.
      </p>
      <div class="offline-actions">
        <button class="btn-primary" onclick="window.location.reload()">
          🔄 Coba Lagi
        </button>
        <a class="btn btn-secondary" href="/">🏠 Beranda</a>
      </div>

      <div class="favorites-section" id="favoritesSection" hidden>
        <h2>❤️ Game favoritmu</h2>
        <div class="favorites-list" id="favoritesList"></div>
      </div>
    </div>

    <script>
      try {
        var favs = JSON.parse(localStorage.getItem("ae_favorites") || "[]");
        if (Array.isArray(favs) && favs.length > 0) {
          var section = document.getElementById("favoritesSection");
          var list = document.getElementById("favoritesList");
          if (section && list) {
            section.hidden = false;
            list.innerHTML = favs
              .slice(0, 6)
              .map(function (g) {
                var safe = String(g)
                  .replace(/&/g, "&amp;")
                  .replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;");
                return '<div class="favorite-item">🎮 ' + safe + "</div>";
              })
              .join("");
          }
        }
      } catch (e) {}
    </script>
  </body>
</html>
